name: Refresh Radiant Aurora books
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update catalog from approved feed
        env:
          RADIANT_BOOKS_FEED_URL: ${{ secrets.RADIANT_BOOKS_FEED_URL }}
          RADIANT_AUTHOR: Radiant Aurora
        run: python automation/sync_books.py
      - name: Commit changed catalog
        run: |
          git config user.name 'radiant-aurora-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add books.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update books catalog'
            git push
          fi
      - name: Deploy to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
           if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
             echo 'Cloudflare secrets not configured; skipping deployment'
             exit 0
           fi
           npx --yes wrangler@3 pages deploy . --project-name=radiant-aurora-books-ai --branch=main
