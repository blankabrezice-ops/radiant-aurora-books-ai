
name: Osveževanje knjig

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  refresh-books:
    runs-on: ubuntu-latest
    steps:
      - name: Prenesi datoteke
        uses: actions/checkout@v4

      - name: Pripravi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preveri nove knjige
        run: python automation/sync_books.py

      - name: Shrani spremembe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books.json
          if ! git diff --cached --quiet; then
            git commit -m "Samodejna osvežitev knjig"
            git push
          fi
